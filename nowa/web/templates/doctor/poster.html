<!doctype html><html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ clinic.name }}</title><link rel="stylesheet" href="/static/nowa.css"></head><body><main class="poster"><header><span class="dot" aria-hidden="true"></span>{{ t('brand') }}</header><h1>{{ clinic.name }}</h1><h2>{{ doctor.name_en if lang == 'en' else doctor.name_ar }}</h2><p>{{ t('scan') }}</p><img src="/d/qr.svg" width="320" height="320" alt="QR"><p dir="ltr">{{ chat_url }}</p><p>{{ clinic.address }}</p><button class="no-print" id="print-poster">{{ t('print') }}</button></main><script src="/static/poster.js"></script></body></html>
