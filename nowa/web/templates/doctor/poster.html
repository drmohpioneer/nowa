<!doctype html><html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t('poster') }} · {{ ui_text('brand', lang) }}</title><link rel="icon" href="/favicon.ico" type="image/svg+xml"><link rel="stylesheet" href="/static/nowa.css"></head><body><main class="page poster"><header class="topbar"><span class="logo" aria-label="Nowa"><span>n</span><i class="o" aria-hidden="true"></i><span>wa</span></span></header><h1>{{ clinic.display_name }}</h1><p>{{ t('scan') }}</p><img src="/d/qr.svg" width="320" height="320" alt="{{ t('qr_alt') }}"><p dir="ltr">{{ chat_url }}</p><p>{{ poster_address }}</p><a class="btn btn-ghost no-print" href="/d?lang={{ lang }}">{{ t('back_board') }}</a><button class="btn btn-main no-print" id="print-poster">{{ t('print') }}</button></main><script src="/static/poster.js"></script></body></html>
