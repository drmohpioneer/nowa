<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نوا | شاهد أمسية</title><link rel="stylesheet" href="/static/nowa.css"><script defer src="/static/phone.js"></script><script defer src="/static/evening.js"></script></head>
<body><main class="page doctor"><div class="topbar"><a href="/" aria-label="Nowa"><span class="logo" aria-label="Nowa"><span>n</span><i class="o" aria-hidden="true"></i><span>wa</span></span></a></div><h1>{{ texts.title }}</h1><p>{{ texts.intro }}</p>
<nav class="actions"><button class="btn btn-ghost" id="play">{{ texts.play }}</button><button class="btn btn-ghost" id="pause">{{ texts.pause }}</button><button class="btn btn-ghost" id="restart">{{ texts.restart }}</button><label>{{ texts.speed }} <select id="speed"><option value="1">×1</option><option value="2" selected>×2</option><option value="4">×4</option></select></label><a href="/d" target="_blank">{{ texts.dashboard }}</a><a id="report" hidden target="_blank">{{ texts.report }}</a></nav>
<p class="pill status" id="status" role="status"></p><p id="error" role="alert"></p><h2>{{ texts.queue }}</h2><div id="queue" class="qlist"></div><h2>{{ texts.phones }}</h2><div id="phones" class="demo-phones"></div><h2>{{ texts.timeline }}</h2><ol id="timeline" class="rows"></ol><script id="demo-texts" type="application/json">{{ texts|tojson }}</script></main></body></html>
