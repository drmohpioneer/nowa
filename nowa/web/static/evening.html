<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نوا | شاهد أمسية</title><link rel="stylesheet" href="/static/nowa.css"><script defer src="/static/phone.js"></script><script defer src="/static/evening.js"></script></head>
<body><main class="doctor-shell"><a href="/">نوا</a><h1>{{ texts.title }}</h1><p>{{ texts.intro }}</p>
<nav><button id="play">{{ texts.play }}</button><button id="pause">{{ texts.pause }}</button><button id="restart">{{ texts.restart }}</button><label>{{ texts.speed }} <select id="speed"><option value="1">×1</option><option value="2" selected>×2</option><option value="4">×4</option></select></label><a href="/d" target="_blank">{{ texts.dashboard }}</a><a id="report" hidden target="_blank">{{ texts.report }}</a></nav>
<p id="status" role="status"></p><p id="error" role="alert"></p><h2>{{ texts.queue }}</h2><div id="queue"></div><h2>{{ texts.phones }}</h2><div id="phones" class="demo-phones"></div><h2>{{ texts.timeline }}</h2><ol id="timeline"></ol><script id="demo-texts" type="application/json">{{ texts|tojson }}</script></main></body></html>
