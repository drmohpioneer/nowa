<!doctype html><html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title }} · {{ t("brand") }}</title><link rel="icon" href="/favicon.ico" type="image/svg+xml"><link rel="stylesheet" href="/static/nowa.css"><script defer src="/static/feedback.js"></script><script defer src="/static/judge.js"></script></head><body>{% include "icons.html" %}<main class="page judge">{% include "public-topbar.html" %}<section class="card auth"><h1>{{ t('judge') }}</h1><p id="signup-message" class="pill status" role="status" aria-live="polite"></p><form id="judge-form"><label class="field"><span>{{ t('judge') }}</span><input name="code" type="password" required autocomplete="off"></label><button class="btn btn-main">{{ t('judge_start') }}</button></form></section><div id="signup-translations" hidden>{% for key,value in texts.items() %}<span data-key="{{ key }}">{{ value }}</span>{% endfor %}</div></main></body></html>
