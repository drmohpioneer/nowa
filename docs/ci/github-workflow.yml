name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nowa_test
          POSTGRES_USER: nowa_test
          POSTGRES_PASSWORD: fictional_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowa_test -d nowa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEMO_MODE: 'true'
      SERVER_SECRET: 'fictional-ci-server-secret-at-least-32-bytes'
      LINK_SECRET: 'fictional-ci-link-secret-at-least-32-bytes'
      TEST_DATABASE_URL: 'postgresql+psycopg://nowa_test:fictional_ci_password@localhost:5432/nowa_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check nowa tests
      - run: mypy nowa
      - run: pytest -q -m "not postgres"
      - run: pytest -q -m postgres
